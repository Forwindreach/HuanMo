name: Bug report / 问题报告
description: Report a reproducible problem in HuanMo
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传包含个人信息的真实文档；请使用脱敏或人工构造的样例。

  - type: input
    id: version
    attributes:
      label: HuanMo version / 换墨版本
      placeholder: e.g. v1.1.1
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system / 操作系统
      options:
        - macOS
        - Windows
        - Linux (source)
        - Other
    validations:
      required: true

  - type: dropdown
    id: feature
    attributes:
      label: Feature area / 功能区域
      options:
        - Document to PDF / 文档转 PDF
        - Document scan / 文档扫描
        - PDF merge / PDF 合并
        - Installation or startup / 安装或启动
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Tell us the smallest reliable sequence that triggers the issue.
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      description: Include the complete error message when available.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context / 补充信息
      description: Screenshots and sanitized sample files are helpful.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私确认
      options:
        - label: I have removed personal or sensitive information from the report and attachments.
          required: true
