    <text x="2" y="204" fill="#87A5BF" font-size="17" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">Private by design. Fast by default. Free and open source.</text>

