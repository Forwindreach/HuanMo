name: Build HuanMo

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r md2pdf_app/requirements.txt pyinstaller

      - name: Build app
        run: python build_app.py

      - name: Package macOS app
        run: |
          cd dist
          zip -r ../HuanMo-macOS.zip HuanMo.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuanMo-macOS
          path: HuanMo-macOS.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HuanMo-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r md2pdf_app/requirements.txt pyinstaller

      - name: Build app
        run: python build_app.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuanMo-Windows
          path: dist/HuanMo.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HuanMo.exe
